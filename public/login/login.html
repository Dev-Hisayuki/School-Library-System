<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Library System - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">
    <h2>School Library System</h2>
    <p>Sign in to access your dashboard</p>

    <!-- Feedback Banners -->
    <div id="error" class="error" style="display:none;"></div>
    <div id="loading" class="loading" style="display:none;">Authenticating...</div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" placeholder="e.g. user123" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="e.g. admin123" required autocomplete="current-password">
                <button type="button" id="togglePassword" class="toggle-btn" aria-label="Toggle password visibility">👁️</button>
            </div>
        </div>
        <button type="submit" class="submit-btn">Login</button>
    </form>
</div>

<script src="login.js"></script>
</body>
</html>
